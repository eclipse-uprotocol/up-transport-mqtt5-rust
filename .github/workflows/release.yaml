# Create artifacts for project releases

name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

concurrency:
  group: "release-${{ github.head_ref || github.ref }}"
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  authenticate:
    name: Test Trusted Publishing authentication
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Exchange and revoke a short-lived crates.io token
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

  check:
    if: github.event_name == 'push'
    uses: ./.github/workflows/check.yaml

  check-msrv:
    if: github.event_name == 'push'
    uses: eclipse-uprotocol/ci-cd/.github/workflows/rust-verify-msrv.yaml@ad3f99eac0675c714f08c473412dae14d9fecaa8

  coverage:
    if: github.event_name == 'push'
    uses: eclipse-uprotocol/ci-cd/.github/workflows/rust-coverage.yaml@ad3f99eac0675c714f08c473412dae14d9fecaa8

  current-spec-compliance:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # we do not invoke the corresponding job from ci-cd repo
    # because we do not want the job to fail if not all requirements
    # are covered (yet)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"
          persist-credentials: false
      - name: "Determine OpenFastTrace file patterns from .env file"
        uses: xom9ikk/dotenv@d0a56edc74279820eabbe34477511327e710d0de # v2.4.0
        with:
          mode: "oft-current"
          load-mode: strict
        # this will run OFT and upload the results
      - name: Run OpenFastTrace
        id: run-oft
        uses: eclipse-uprotocol/ci-cd/.github/actions/run-oft@ad3f99eac0675c714f08c473412dae14d9fecaa8
        with:
          file-patterns: "${{ env.OFT_FILE_PATTERNS }}"
          tags: "${{ env.OFT_TAGS_}}"

  licenses:
    if: github.event_name == 'push'
    # This works off the license declarations in dependent packages/crates, so if these declarations are wrong, this report will contain erroneous information
    uses: eclipse-uprotocol/ci-cd/.github/workflows/rust-license-report.yaml@ad3f99eac0675c714f08c473412dae14d9fecaa8
    with:
      templates: "about.hbs"
      config: "about.toml"

  tag_release_artifacts:
    # This only runs if this workflow is initiated via a tag-push with pattern 'v*'
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    name: collect v-tag release artifacts
    runs-on: ubuntu-latest
    needs: 
      - check
      - check-msrv
      - coverage
      - current-spec-compliance
      - licenses
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"
          persist-credentials: false

      - name: "Determine uProtocol Specification file patterns from .env file"
        uses: xom9ikk/dotenv@d0a56edc74279820eabbe34477511327e710d0de # v2.4.0
        with:
          mode: oft-current
          load-mode: strict

      # License report - we later need the download_url output of the upload step
      - name: Download license report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: license-report
          path: dist/license/
      - name: Upload license report to release
        id: upload_license_report
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          archive="license-report.tar.gz"
          tar -czf "$archive" -C dist license
          gh release upload "$TAG" "$archive" --clobber
          echo "browser_download_url=${{ github.server_url }}/${{ github.repository }}/releases/download/$TAG/$archive" >> "$GITHUB_OUTPUT"

      # Requirements Tracing report - we later need the download_url output of the upload step
      - name: Download requirements tracing report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tracing-report-html
          path: dist/tracing/
      - name: Upload requirements tracing report to release
        id: upload_requirements_tracing_report
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          archive="tracing-report-html.tar.gz"
          tar -czf "$archive" -C dist tracing
          gh release upload "$TAG" "$archive" --clobber
          echo "browser_download_url=${{ github.server_url }}/${{ github.repository }}/releases/download/$TAG/$archive" >> "$GITHUB_OUTPUT"

      # Test results - we later need the download_url output of the upload step
      - name: Download test report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-results
          path: dist/tests/
      - name: Upload test report to release
        id: upload_test_report
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          archive="test-results.tar.gz"
          tar -czf "$archive" -C dist tests
          gh release upload "$TAG" "$archive" --clobber
          echo "browser_download_url=${{ github.server_url }}/${{ github.repository }}/releases/download/$TAG/$archive" >> "$GITHUB_OUTPUT"

      # Test coverage - we later need the download_url output of the upload step
      - name: Download test coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: code-coverage-html
          path: dist/codecov/
      - name: Upload test coverage to release
        id: upload_test_coverage
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          archive="code-coverage-html.tar.gz"
          tar -czf "$archive" -C dist codecov
          gh release upload "$TAG" "$archive" --clobber
          echo "browser_download_url=${{ github.server_url }}/${{ github.repository }}/releases/download/$TAG/$archive" >> "$GITHUB_OUTPUT"

      # README - we later need the download_url output of the upload step
      - name: Upload README to release
        id: upload_readme
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" README.md --clobber
          echo "browser_download_url=${{ github.server_url }}/${{ github.repository }}/releases/download/$TAG/README.md" >> "$GITHUB_OUTPUT"

      - name: Gather uProtocol Specification documents
        shell: bash
        env:
          UP_SPEC_FILE_PATTERNS: ${{ env.UP_SPEC_FILE_PATTERNS }}
        run: |
          tar cvz --file up-spec.tar.gz $UP_SPEC_FILE_PATTERNS
      - name: Upload relevant uProtocol Spec files to release
        id: upload_up_spec
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" up-spec.tar.gz --clobber
          echo "browser_download_url=${{ github.server_url }}/${{ github.repository }}/releases/download/$TAG/up-spec.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Gets latest created release info
        id: latest_release_info
        uses: joutvhu/get-release@8c3531bba0d249f5e7c3d7e1954d34db9edf2a90 # v1.0.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
      - name: Collect quality artifacts
        uses: eclipse-dash/quevee@b62d7faa1cf68654758754aaed8616b19f227583 # v1.0.0
        id: quevee_manifest
        with:          
          release_url: ${{ steps.latest_release_info.outputs.html_url }}
          artifacts_documentation: ${{ steps.upload_up_spec.outputs.browser_download_url }}
          artifacts_readme: ${{ steps.upload_readme.outputs.browser_download_url }}
          artifacts_requirements: ${{ steps.upload_up_spec.outputs.browser_download_url }}
          artifacts_testing: ${{ steps.upload_test_report.outputs.browser_download_url }},${{ steps.upload_test_coverage.outputs.browser_download_url }},${{ steps.upload_requirements_tracing_report.outputs.browser_download_url }}

      - name: Upload manifest to release
        id: upload_quality_manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          MANIFEST_FILE: ${{ steps.quevee_manifest.outputs.manifest_file }}
        run: |
          gh release upload "$TAG" "${MANIFEST_FILE}" --clobber

  cargo-publish:
    name: publish to crates.io
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs:
      - tag_release_artifacts
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: ${{ vars.RUST_TOOLCHAIN || 'stable' }}
          cache: false

      - name: Verify package before authentication
        run: cargo publish --all-features --dry-run

      - name: Authenticate with crates.io
        id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # The dry run above already verified this package from the same checkout.
      - name: Publish verified package
        run: cargo publish --all-features --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}

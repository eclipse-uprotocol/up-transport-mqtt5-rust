[package]
description = "The Eclipse uProtocol MQTT 5 Transport Library"
edition = "2021"
exclude = ["tests/*", "tools/*", ".devcontainer/*", ".vscode/*", ".github/*", ".gitignore"]
homepage = "https://github.com/eclipse-uprotocol/up-transport-mqtt5-rust"
keywords = ["uProtocol", "SDK", "MQTT", "MQTT5"]
license = "Apache-2.0"
name = "up-transport-mqtt5"
readme = "README.md"
repository = "https://github.com/eclipse-uprotocol/up-transport-mqtt5-rust"
rust-version = "1.88"
version = "0.5.0-SNAPSHOT"
resolver = "2"

[features]
default = ["cli"]
cli = ["clap"]

[dependencies]
async-channel = { version = "2.5" }
async-trait = { version = "0.1.92" }
backon = { version = "1.6", default-features = false, features = ["tokio-sleep"] }
bytes = { version = "1.12.1" }
clap = { version = "4.6.6", optional = true, default-features = false, features = [
    "std",
    "derive",
    "env",
    "color",
    "help",
    "usage",
    "error-context",
    "suggestions",
] }
futures = { version = "0.3.34" }
paho-mqtt = { version = "0.14.0", features = ["vendored-ssl"] }
protobuf = { version = "3.7.2" }
# https://rustsec.org/advisories/RUSTSEC-2026-0097
rand = { version = "0.9.5" }
slab = { version = "0.4.12" }
tokio = { version = "1.53.1", default-features = false, features = [
    "rt",
    "rt-multi-thread",
    "sync",
] }
tracing = { version = "0.1", default-features = false }
up-rust = { version = "0.9", default-features = false }

[build-dependencies]
testcontainers = { version = "0.28.0", default-features = false, features = ["blocking"] }

[dev-dependencies]
# https://rustsec.org/advisories/RUSTSEC-2026-0145
astral-tokio-tar = { version = "0.6.4" }
mockall = { version = "0.15.0" }
serial_test = { version = "3.5.0" }
tempfile = { version = "3.27.0" }
test-case = { version = "3.3.1" }
testcontainers = { version = "0.28.0", default-features = false }
# https://rustsec.org/advisories/RUSTSEC-2026-0099
rustls-webpki = { version = "0.103.14" }
# https://rustsec.org/advisories/RUSTSEC-2026-0009
time = { version = "0.3.55" }
tokio = { version = "1.53.1", default-features = false, features = [
    "macros",
    "rt",
    "signal",
    "sync",
] }
tracing = { version = "0.1", default-features = false, features = ["log", "std"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
up-rust = { version = "0.9", default-features = false, features = ["test-util"] }

[[example]]
name = "publisher_example"
required-features = ["cli"]

[[example]]
name = "subscriber_example"
required-features = ["cli"]

[package.metadata.docs.rs]
all-features = true

[package.metadata.cargo-all-features]
# optional dependencies are activated by means of features only
skip_optional_dependencies = true
max_combination_size = 3

[lints.rust]
# The build.rs script determines if Docker is available on the build
# platform and adds the 'docker_available' cfg flag accordingly.
# Tests using #[cfg(docker_available)] will then only be compiled (and run)
# if Docker is actually available on the platform.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docker_available)'] }

[lints.clippy]
ignored_unit_patterns = "warn"
or_fun_call = "warn"
as_conversions = "warn"
